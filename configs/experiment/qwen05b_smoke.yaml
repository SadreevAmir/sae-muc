# Smoke test: local Qwen2.5-0.5B driving the full pipeline on 10 NQ-Open
# questions, judged by Qwen-2.5-72B via OpenRouter, SE via DeBERTa-v3-base NLI.
# Requires OPENROUTER_API_KEY in .env.
#
# Run:  uv run sae-muc run --config configs/experiment/qwen05b_smoke.yaml

extends: ../base.yaml

model: ../model/qwen2_5_0_5b.yaml
judge: ../judge/openrouter_qwen25_72b.yaml
nli: ../nli/deberta_v3_base.yaml

# Dataset inline because n_samples=10 for smoke is tiny vs nq_open.yaml's 500.
dataset:
  name: nq_open
  split: validation
  n_samples: 10
  seed: 0

stages:
  generate:
    n_samples: 4
    temperature_low: 0.1
    temperature_high: 1.0
    max_new_tokens: 40
  vuf:
    layers: auto
    n_top: 2
    n_bot: 2
    pooling: last_token_q
  intervene:
    method: linear_vuf
    mode: adaptive           # paper §4.2 Eq.5-6
    alpha_grid: [-1.0, 0.0, 1.0]  # ignored when mode=adaptive
    alpha_max: 1.0
    layer: auto

seed: 42
