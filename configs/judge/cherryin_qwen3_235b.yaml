# Strong non-thinking Qwen3 instruct via CherryIn (corporate prepaid account).
# Chosen over OpenRouter Llama-70b: goal is RELATIVE effects (absolute Table 1/3
# numbers not targeted) + corporate billing. Non-thinking instruct => fast/reliable
# (probe: 6/6 @ ~0.9s, cheapest of the candidates) vs the thinking *flash* variants
# (37% timeouts, ~12s). CHERRYIN_API_KEY in .env.
provider: cherryin
model: qwen/qwen3-235b-a22b-instruct-2507
max_retries: 3
# CherryIn load-tested clean at 8 concurrent calls (~6 calls/s); cuts the
# judge stages from the full-run bottleneck (~13h @ N=1000) to ~1.6h.
concurrency: 8
