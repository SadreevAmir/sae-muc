[project]
name = "sae-muc"
version = "0.0.1"
description = "Calibrate verbal uncertainty in LLMs with linear and SAE-based interventions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Pin: 2.5.1 is the last torch with CU121 wheels. caniculus has driver
    # 535.x (CUDA 12.2 max), so CU121 is the newest forward-compat option;
    # CU124+ wheels need driver ≥ 550.x. Bump only after the host driver does.
    "torch>=2.4,<2.6",
    "transformers>=4.44",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26,<2.1",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "typer>=0.12",
    # click 8.2 (May 2025) made `Parameter.make_metavar(ctx)` require ctx, which
    # typer<0.13 doesn't pass → TypeError on `--help` / any parse error. We can't
    # bump typer because transformer-lens (via sae-lens) caps it at <0.12.3, so
    # cap click instead. Drop this once sae-lens loosens transformer-lens pin.
    "click<8.2",
    "datasets>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
sae = ["sae-lens>=6.0"]

[project.scripts]
sae-muc = "sae_muc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae_muc"]

# Force torch from PyTorch's CU121 index. PyPI's default wheel for current
# torch versions bundles CUDA 13 libs (nvidia-cudnn-cu13 etc) which the
# caniculus driver (535.x, CUDA 12.2 max) cannot run. Without this section
# uv resolves to PyPI default and torch silently falls back to CPU.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["archive", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
