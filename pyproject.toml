[project]
name = "sae-muc"
version = "0.0.1"
description = "Calibrate verbal uncertainty in LLMs with linear and SAE-based interventions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26,<2.1",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "datasets>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
sae = ["sae-lens>=6.0"]

[project.scripts]
sae-muc = "sae_muc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae_muc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["archive", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
